name: Build and release Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Verify Maven is available
        run: mvn -version

      - name: Build jar + stage x86/x64 + compile installers
        shell: pwsh
        working-directory: packaging/windows
        run: .\build-installer.ps1

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DotMatrixPrintAgent-installers
          path: packaging/windows/output/*.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/output/*.exe
          generate_release_notes: true
